<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin — AURA GRAPHIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>:root{--bg:#0B0F17;--ac:#00F2FE;--card:#121926}body{background:var(--bg);color:#fff;font-family:system-ui,sans-serif}.ac{color:var(--ac)}
.btn{background:var(--ac);color:var(--bg);font-weight:700;padding:.65rem 1.25rem;border-radius:.5rem}.card{background:var(--card);border:1px solid #1e2838;border-radius:.75rem;padding:1.25rem}
input,textarea,select{background:var(--bg);border:1px solid #1e2838;border-radius:.5rem;padding:.65rem;width:100%;color:#fff}label{display:block;font-size:.85rem;color:#9ca3af;margin:.75rem 0 .25rem}
.tab{padding:.5rem 1rem;border-radius:.5rem;border:1px solid #1e2838}.tab.on{background:var(--ac);color:var(--bg)}input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac)}</style></head><body class="p-4 max-w-3xl mx-auto">
<div id="login" class="card mt-16 max-w-sm mx-auto hidden"><h1 class="text-xl font-bold mb-2">Owner login</h1>
<label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
<button id="go" class="btn mt-4 w-full">Sign in</button><p id="err" class="text-red-400 text-sm mt-2"></p><a href="index.html" class="text-sm text-gray-400 block mt-4">Back to site</a></div>
<div id="app" class="hidden"><div class="flex justify-between items-center mb-4"><b>AURA GRAPHIC <span class="ac">Admin</span></b><span><a href="index.html" class="text-sm text-gray-400 mr-4">View site</a><button id="out" class="text-sm underline">Sign out</button></span></div>
<div class="flex gap-2 mb-4"><button class="tab on" data-t="p">Projects</button><button class="tab" data-t="c">Site text</button><button class="tab" data-t="m">Messages</button></div>
<div id="p"><form id="pf" class="card"><h2 class="font-bold">Add project</h2><label>Title</label><input name="title" required><label>Category</label><input name="category" placeholder="Logo, Poster, Branding…" required>
<label>Description</label><textarea name="description" rows="3"></textarea><label>Image</label><input name="file" type="file" accept="image/*" required><button class="btn mt-4">Upload project</button><p id="pm" class="text-sm mt-2"></p></form><div id="pl" class="mt-4 space-y-2"></div></div>
<div id="c" class="hidden"><form id="cf" class="card"></form></div><div id="m" class="hidden space-y-2"></div></div>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=[['hero_title','Hero headline',1],['hero_sub','Hero subtext',2],['about','About Deb',5],['services','Services (one per line: Title | description)',5],['testimonials','Testimonials (one per line: Name | quote)',5],['email','Email',1],['phone','Phone',1],['location','Location',1]];
async function show(){const{data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session){loadP();loadC();loadM()}}
$('go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});$('err').textContent=error?'Wrong email or password.':'';show()};
$('out').onclick=async()=>{await sb.auth.signOut();show()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==b));['p','c','m'].forEach(k=>$(k).classList.toggle('hidden',k!=b.dataset.t))});
async function loadP(){const{data}=await sb.from('projects').select('*').order('created_at',{ascending:false});
$('pl').innerHTML=(data||[]).map(p=>`<div class="card flex gap-3 items-center"><img src="${esc(p.image_url)}" class="w-16 h-16 object-cover rounded"><div class="flex-1"><b>${esc(p.title)}</b><p class="ac text-xs">${esc(p.category)}</p></div><button class="text-red-400 text-sm" data-id="${p.id}" data-path="${esc(p.image_path)}">Delete</button></div>`).join('')||'<p class="text-gray-400">No projects yet. Add your first one above.</p>'}
$('pl').onclick=async e=>{const b=e.target.closest('button');if(!b||!confirm('Delete this project?'))return;await sb.storage.from('portfolio').remove([b.dataset.path]);await sb.from('projects').delete().eq('id',b.dataset.id);loadP()};
$('pf').onsubmit=async e=>{e.preventDefault();const f=e.target,file=f.file.files[0],path=Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');$('pm').textContent='Uploading…';
const u=await sb.storage.from('portfolio').upload(path,file);if(u.error){$('pm').textContent='Upload failed: '+u.error.message;return}
const url=sb.storage.from('portfolio').getPublicUrl(path).data.publicUrl;
const r=await sb.from('projects').insert({title:f.title.value,category:f.category.value,description:f.description.value,image_url:url,image_path:path});
$('pm').textContent=r.error?'Save failed: '+r.error.message:'Published. It is live on your site now.';if(!r.error){f.reset();loadP()}};
async function loadC(){let C={...DEF};const{data}=await sb.from('site_content').select('*');(data||[]).forEach(r=>C[r.key]=r.value);
$('cf').innerHTML=F.map(([k,l,n])=>`<label>${l}</label>`+(n>1?`<textarea name="${k}" rows="${n}">${esc(C[k])}</textarea>`:`<input name="${k}" value="${esc(C[k])}">`)).join('')+'<button class="btn mt-4">Save changes</button><span id="cm" class="text-sm ml-3"></span>'}
$('cf').onsubmit=async e=>{e.preventDefault();const rows=F.map(([k])=>({key:k,value:e.target[k].value}));const{error}=await sb.from('site_content').upsert(rows);$('cm').textContent=error?'Save failed: '+error.message:'Saved.'};
async function loadM(){const{data}=await sb.from('messages').select('*').order('created_at',{ascending:false});
$('m').innerHTML=(data||[]).map(m=>`<div class="card"><b>${esc(m.name)}</b> <a class="ac text-sm" href="mailto:${esc(m.email)}">${esc(m.email)}</a><p class="text-gray-300 mt-1 whitespace-pre-line">${esc(m.message)}</p></div>`).join('')||'<p class="text-gray-400">No messages yet.</p>'}
show();
</script></body></html>
